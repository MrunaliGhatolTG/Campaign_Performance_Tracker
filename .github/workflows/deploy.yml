name: Deploy to GitHub Pages

# Builds the sample-data version — no backend is involved, nothing is fetched.
# The app lives in frontend/, so every npm step runs from there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # project site lives at /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run instead of failing with
          # "Get Pages site failed ... Not Found" when it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # paths here are relative to the workspace root, not frontend/
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
